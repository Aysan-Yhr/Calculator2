<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="fontawesome-free-7.1.0-web/css/all.min.css">
   
</head>
<body>
    <div class="container">

            <div class="flex-container">
                <div class="first-section">
                    <div class="calculator-section">Calculator</div>
                    <div class="standard-section">
                        <div><i class="fa fa-bars"></i></div>
                        <div>Standard</div>
                        <div><i class='fas fa-list-alt'></i></div>
                    </div>
                    <div class="zero">0</div>
                    <div class="M-buttons">
                        <div class="M">MC</div>
                        <div class="M">MR</div>
                        <div class="M">M+</div>
                        <div class="M">M-</div>
                        <div class="M">MS</div>
                    </div>
                </div>
                <div class="gridbox">
                    <div class="grid-Percentage gray-button " style="">%</div>
                    <div class="grid-CE gray-button">CE</i></div>
                    <div class="grid-C gray-button operator">C<i class='fas fa-superscript'></i></div>
                    <div class="grid-table gray-button operator"><i class='fas fa-table'></i></i></div>
                    <div class="grid-Division gray-button operator"><i class='fas fa-divide'></i></div>
                    <div class="grid-check gray-button operator"><i class="fa fa-check"></i></div>
                    <div class="grid-7 white-button">7</div>
                    <div class="grid-8 white-button ">8</i></div>
                    <div class="grid-9 white-button" >9</div>
                    <div class="grid-Multiplication gray-button" ><i class='fas fa-times'></i></div>
                    <div class="grid-superscript gray-button" ><i class='fas fa-superscript'></i></div>
                    <div class="grid-4 white-button" >4</div>
                    <div class="grid-5 white-button" >5</div>
                    <div class="grid-6 white-button" >6</div>
                    <div class="grid-minus gray-button" >-</div>
                    <div class="grid-square gray-button operator" ><i class='fas fa-square-root-alt'></i></div>
                    <div class="grid-1 white-button" >1</div>
                    <div class="grid-2 white-button" >2</div>
                    <div class="grid-3 white-button" >3</div>
                    <div class="grid-Plus gray-button" >+</div>
                    <div class="grid-Exit gray-button" >1/x</div>
                    <div class="grid-or gray-button" >+/-</div>
                    <div class="grid-0 white-button" >0</div>
                    <div class="grid-Point gray-button" >.</div>
                    <div class="grid-Equal gray-button" >=</div>
                </div>
        </div>

        <div class="right-section">
            <div class="icon-section">
                <div><i class="fa fa-window-minimize"></i></div>
                <div><i class='far fa-clone'></i></i></div>
                <div><i class="fa fa-close"></i></div>
            </div>
            <div class="history-section">
                <p class="history">History</p>
                <p>Memory</p>
            </div>
            <div class="sentence-section">
                <p>There's no history yet</p>
            </div>
        </div>
    </div>
</body>
</html>
